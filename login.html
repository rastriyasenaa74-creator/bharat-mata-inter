<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Login | Bharat Mata Inter College</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="siteHeader"></div><main><section class="page-hero compact"><span class="eyebrow">SECURE ACCESS</span><h1>School portal login</h1><p>Choose your role and sign in with credentials provided by the school.</p></section><section class="section login-wrap"><form id="loginForm" class="form-card login-card"><div class="role-tabs"><label><input type="radio" name="role" value="admin" checked><span>Admin</span></label><label><input type="radio" name="role" value="teacher"><span>Teacher</span></label><label><input type="radio" name="role" value="student"><span>Student</span></label></div><label>Username / ID<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-primary full-width">Sign in securely</button><p id="loginMessage" class="form-message" role="status"></p><p class="small-muted">Authentication is not active until the Apps Script backend URL is configured and deployed.</p></form></section></main><div id="siteFooter"></div><script src="assets/js/config.js"></script><script src="assets/js/app.js"></script></body></html>
